; Orbit production PHP settings (layered on top of php.ini-production).

expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 10M
post_max_size = 12M
variables_order = EGPCS

; Logs go to stderr so the container runtime collects them.
error_log = /proc/self/fd/2
log_errors = On
display_errors = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is immutable inside the image: never stat files (override with env for local dev).
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.jit = tracing
opcache.jit_buffer_size = 32M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
