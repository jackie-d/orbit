; Orbit PHP-FPM pool overrides (values come from environment variables).

[global]
; Stay in the foreground: the container runtime supervises the process.
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000

; Expose container / Kubernetes environment variables to Laravel.
clear_env = no

pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Probes (used by fpm-healthcheck; not routed by nginx).
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Nginx already logs requests.
access.log = /dev/null

catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 300s
