name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/orbit

jobs:
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl, pdo_pgsql, pdo_sqlite, redis, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Fresh checkouts have no .env: create one with an APP_KEY for the tests.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Code style
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Test suite
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'orbit_test' || ':memory:' }}
          DB_USERNAME: orbit
          DB_PASSWORD: orbit

  # ---------------------------------------------------------------------------
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint
        run: |
          helm lint --strict helm/orbit -f helm/orbit/values-dev.yaml
          helm lint --strict helm/orbit -f helm/orbit/values-prod.yaml

      - name: Default values must refuse to render without a database
        run: |
          if helm template orbit helm/orbit 2>err.txt; then
            echo "expected a required-value error"; exit 1
          fi
          grep -q "externalDatabase.host is required" err.txt

      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in values-dev.yaml values-prod.yaml; do
            echo "::group::$values"
            helm template orbit helm/orbit -n orbit -f helm/orbit/$values \
              | ./kubeconform -strict -summary -kubernetes-version 1.34.0
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, nginx]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: APP_VERSION=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end on kind
    runs-on: ubuntu-latest
    needs: [tests, helm]
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: make build TAG=ci

      - uses: helm/kind-action@v1
        with:
          cluster_name: orbit

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install chart
        run: |
          kind load docker-image --name orbit orbit-app:ci orbit-nginx:ci
          helm upgrade --install orbit helm/orbit -n orbit --create-namespace \
            -f helm/orbit/values-dev.yaml \
            --set image.app.tag=ci --set image.nginx.tag=ci \
            --set image.app.pullPolicy=Never --set image.nginx.pullPolicy=Never \
            --wait --timeout 10m

      - name: Helm test
        run: helm test orbit -n orbit --logs

      - name: Smoke test through the Service
        run: |
          kubectl -n orbit port-forward svc/orbit 8080:80 >/tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/up >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:8080 scripts/smoke-test.sh

      - name: Upgrade (runs the pre-upgrade migration hook)
        run: |
          helm upgrade orbit helm/orbit -n orbit -f helm/orbit/values-dev.yaml \
            --set image.app.tag=ci --set image.nginx.tag=ci \
            --set image.app.pullPolicy=Never --set image.nginx.pullPolicy=Never \
            --set web.replicaCount=2 --wait --timeout 10m
          kubectl -n orbit get pods

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n orbit get all,pvc,events
          kubectl -n orbit describe pods
          kubectl -n orbit logs -l app.kubernetes.io/instance=orbit --all-containers --tail=200 --prefix
