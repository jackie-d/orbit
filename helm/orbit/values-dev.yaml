# Local cluster (kind / minikube / Docker Desktop):
#
#   make kind-up      # builds images, creates a kind cluster, installs this chart
#
# or manually:
#   helm upgrade --install orbit helm/orbit -f helm/orbit/values-dev.yaml -n orbit --create-namespace

image:
  app:
    repository: orbit-app
    tag: dev
    pullPolicy: IfNotPresent
  nginx:
    repository: orbit-nginx
    tag: dev
    pullPolicy: IfNotPresent

app:
  env: local
  debug: true
  logLevel: debug
  # Reached with: kubectl -n orbit port-forward svc/orbit 8080:80
  url: http://localhost:8080
  corsAllowedOrigins: "http://localhost:3000"

web:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false

postgresql:
  enabled: true
  persistence:
    size: 1Gi

redis:
  enabled: true

persistence:
  size: 1Gi

# Local clusters usually have no ingress controller: use port-forward (see above).
# With one installed (e.g. Traefik on k3d / k3s), enable this instead.
ingress:
  enabled: false
  className: traefik
  hosts:
    # *.localtest.me resolves to 127.0.0.1
    - host: orbit.localtest.me
      paths:
        - path: /
          pathType: Prefix
