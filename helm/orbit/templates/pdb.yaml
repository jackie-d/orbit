{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orbit.fullname" . }}-web
  labels:
    {{- include "orbit.componentLabels" (list . "web") | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "orbit.componentSelectorLabels" (list . "web") | nindent 6 }}
{{- end }}
