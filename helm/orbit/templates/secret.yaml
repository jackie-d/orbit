{{- if not .Values.existingSecret }}
{{- $dbPassword := "" }}
{{- if .Values.postgresql.enabled }}
{{- $dbPassword = include "orbit.secretValue" (dict "ctx" . "key" "DB_PASSWORD" "value" .Values.postgresql.password "generate" "password") }}
{{- else }}
{{- $dbPassword = .Values.externalDatabase.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbit.fullname" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
type: Opaque
data:
  APP_KEY: {{ include "orbit.secretValue" (dict "ctx" . "key" "APP_KEY" "value" .Values.app.key "generate" "appkey") | b64enc | quote }}
  DB_PASSWORD: {{ $dbPassword | b64enc | quote }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.app.photoDisk "s3" }}
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
