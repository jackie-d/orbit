apiVersion: v1
kind: Pod
metadata:
  name: {{ include "orbit.fullname" . }}-test-connection
  labels:
    {{- include "orbit.componentLabels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Keep the pod after the test so `helm test --logs` can read its output;
    # it is replaced on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readiness
      image: {{ .Values.tests.image }}
      args:
        - --fail-with-body
        - --silent
        - --show-error
        - --retry
        - "5"
        - --retry-all-errors
        - http://{{ include "orbit.fullname" . }}:{{ .Values.service.port }}/api/v1/health/ready
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
